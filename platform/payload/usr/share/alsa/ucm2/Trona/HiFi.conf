SectionVerb {
 EnableSequence [
  cset "name='Speaker Switch' off"
  cset "name='Headphone Switch' off"
  cset "name='ADDA_DL_CH1 DL1_CH1' on"
  cset "name='ADDA_DL_CH2 DL1_CH2' on"
  cset "name='DAC In Mux' 'Normal Path'"
  cset "name='HPL Mux' 'Audio Playback'"
  cset "name='HPR Mux' 'Audio Playback'"
  # Fixed conservative analog gain; desktop volume is handled digitally.
  cset "name='Headphone Volume' 0,0"
  cset "name='Lineout Volume' 0,0"
 ]
 DisableSequence [
  cset "name='Speaker Switch' off"
  cset "name='HPL Mux' Open"
  cset "name='HPR Mux' Open"
  cset "name='ADDA_DL_CH1 DL1_CH1' off"
  cset "name='ADDA_DL_CH2 DL1_CH2' off"
 ]
 Value { TQ "HiFi" }
}
SectionDevice."Speaker" {
 Comment "Built-in speakers"
 EnableSequence [ cset "name='Speaker Switch' on" ]
 DisableSequence [ cset "name='Speaker Switch' off" ]
 Value {
  PlaybackPCM "hw:${CardId},0"
  PlaybackChannels 2
  PlaybackRate 48000
  PlaybackPriority 200
 }
}

SectionDevice."Mic" {
 Comment "Built-in microphones"
 EnableSequence [
  cset "name='UL1_CH1 ADDA_UL_CH1' on"
  cset "name='UL1_CH2 ADDA_UL_CH2' on"
  cset "name='AIF Out Mux' 'Normal Path'"
  cset "name='Mic Type Mux' ACC"
  cset "name='PGA L Mux' AIN0"
  cset "name='PGA R Mux' AIN2"
  cset "name='ADC L Mux' 'Left Preamplifier'"
  cset "name='ADC R Mux' 'Right Preamplifier'"
  cset "name='PGA Volume' 4,4"
  cset "name='Internal Mic Switch' on"
 ]
 DisableSequence [
  cset "name='Internal Mic Switch' off"
  cset "name='UL1_CH1 ADDA_UL_CH1' off"
  cset "name='UL1_CH2 ADDA_UL_CH2' off"
  cset "name='Mic Type Mux' Idle"
 ]
 Value {
  CapturePCM "hw:${CardId},1"
  CaptureChannels 2
  CaptureRate 48000
  CapturePriority 200
 }
}
