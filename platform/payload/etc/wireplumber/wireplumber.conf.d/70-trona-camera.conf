# Front and rear cameras through libcamera software ISP.
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "libcamera_input._base_i2c-gpio-2_camera_20" } ]
    actions = { update-props = { node.description = "Rückkamera" node.nick = "Rückkamera" } }
  }
  {
    matches = [ { node.name = "libcamera_input._base_i2c-gpio-4_camera_3c" } ]
    actions = { update-props = { node.description = "Frontkamera" node.nick = "Frontkamera" } }
  }
]

# Raw Bayer capture nodes are not usable webcams. Keep USB webcams unaffected.
monitor.v4l2.rules = [
  {
    matches = [ { device.product.name = "mtk-camsv-isp" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
