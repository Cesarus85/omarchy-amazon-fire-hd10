name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/check-source.py
      - run: python3 tests/test-profile.py
      - run: python3 tests/test-responsive-cpu.py
      - run: python3 tests/test-update-guard.py
      - run: python3 tests/test-fast-apps.py
      - run: python3 tests/test-dock-back.py
      - run: python3 tests/test-legacy-proxy.py
      - run: python3 tests/test-tablet-windows.py
      - run: python3 tests/test-unicode-insert.py
      - run: python3 tests/test-video-integration.py
      - run: sudo apt-get update -qq && sudo apt-get install -y fdisk lua5.4
      - run: lua5.4 tests/test-dock-focus.lua
      - run: python3 tests/test-installer.py
      - run: python3 tests/test-rotation-policy.py
      - run: python3 drivers/connectivity/tests/rx-eapol-optional-status.py
  gtk-file-dialogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev gir1.2-gtk-3.0 python3-gi xvfb xauth
      - run: cc -fPIC -shared platform/trona-filechooser.c $(pkg-config --cflags --libs gtk+-3.0) -o "$RUNNER_TEMP/trona-filechooser.so"
      - run: GTK3_MODULES="$RUNNER_TEMP/trona-filechooser.so" GSETTINGS_BACKEND=memory xvfb-run -a /usr/bin/python3 tests/test-filechooser.py
  scp-proxy-emulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y clang binutils-arm-none-eabi
      - run: python3 -m pip install pyelftools==0.33 unicorn==2.1.4
      - run: bash experiments/video-decode/scp-proxy/build-helper.sh
      - run: python3 experiments/video-decode/scp-proxy/test-proxy.py build/scp-proxy
